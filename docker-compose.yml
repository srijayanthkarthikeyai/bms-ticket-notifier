services:
  redis:
    image: redis:7-alpine
    container_name: bms_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bms_web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - sqlite_data:/app/data
    depends_on:
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bms_celery_worker
    restart: unless-stopped
    command: celery -A core worker -l info --concurrency=2
    env_file:
      - .env
    volumes:
      - .:/app
      - sqlite_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_started

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bms_celery_beat
    restart: unless-stopped
    command: celery -A core beat -l info --pidfile=/tmp/celerybeat.pid
    env_file:
      - .env
    volumes:
      - .:/app
      - sqlite_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started

volumes:
  redis_data:
  sqlite_data: